<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIS - Investment Research Terminal</title>
<script>try{var t=localStorage.getItem('mis_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
:root{--bg:#eef1f4;--panel:#fff;--panel2:#f6f8fa;--ink:#101a22;--mute:#5a6a76;--line:#d5dde3;--acc:#0a5c80;--accbg:#e2f0f6;--pos:#0b7a4b;--neg:#b3261e;--amb:#8a5700;--ambbg:#fff2d1;--negbg:#fde8e6;--posbg:#e3f4ec;--shadow:0 1px 0 rgba(16,26,34,.04)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1216;--panel:#151c22;--panel2:#1a232a;--ink:#e4ebef;--mute:#8fa1ad;--line:#26323b;--acc:#58bde8;--accbg:#13303d;--pos:#4fd18e;--neg:#ff8c82;--amb:#f3c45f;--ambbg:#352b10;--negbg:#3a1a18;--posbg:#10301f}}
:root[data-theme="dark"]{--bg:#0d1216;--panel:#151c22;--panel2:#1a232a;--ink:#e4ebef;--mute:#8fa1ad;--line:#26323b;--acc:#58bde8;--accbg:#13303d;--pos:#4fd18e;--neg:#ff8c82;--amb:#f3c45f;--ambbg:#352b10;--negbg:#3a1a18;--posbg:#10301f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--acc)}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:15px;padding:4px 10px 12px}.brand small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.side nav a{display:block;padding:8px 10px;color:var(--ink);text-decoration:none;border-left:3px solid transparent}
.side nav a:hover{background:var(--panel2)}.side nav a[aria-current="page"]{border-left-color:var(--acc);background:var(--accbg);font-weight:650}
.side nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.side .foot{padding:12px 10px;color:var(--mute);font-size:12px}
.main{min-width:0}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
.top h1{font-size:16px;margin:0 8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{border:1px solid var(--line);background:var(--panel2);padding:2px 9px;font-size:12px;white-space:nowrap}
.chip.pos{color:var(--pos);border-color:var(--pos)}.chip.neg{color:var(--neg);border-color:var(--neg);background:var(--negbg)}.chip.amb{color:var(--amb);border-color:var(--amb);background:var(--ambbg)}
#view{padding:16px 18px 60px;max-width:1280px}
h2{font-size:16px;margin:22px 0 8px}h3{font-size:14px;margin:14px 0 6px}
.mute{color:var(--mute)}.pos{color:var(--pos)}.neg{color:var(--neg)}.amb{color:var(--amb)}
.banner{padding:9px 12px;margin:0 0 12px;border:1px solid var(--amb);background:var(--ambbg)}
.banner.neg{border-color:var(--neg);background:var(--negbg)}
.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.panel>h2:first-child,.panel>h3:first-child{margin-top:0}
.kpi .l{color:var(--mute);font-size:12px}.kpi .v{font-size:20px;font-weight:650}.kpi .s{font-size:12px;color:var(--mute)}
.src{display:inline-block;border:1px solid var(--line);color:var(--mute);font-size:11px;padding:0 5px;margin-left:5px;vertical-align:middle}
.tag{display:inline-block;padding:1px 8px;border:1px solid currentColor;font-size:12px;font-weight:650;white-space:nowrap}
.tag.pos{background:var(--posbg)}.tag.neg{background:var(--negbg)}.tag.amb{background:var(--ambbg)}
.item{border:1px solid var(--line);border-left:4px solid var(--line);background:var(--panel);padding:9px 12px;margin:7px 0}
.item.CRITICAL{border-left-color:var(--neg)}.item.HIGH{border-left-color:var(--amb)}.item.MEDIUM{border-left-color:var(--acc)}
.item h4{margin:0 0 3px;font-size:14px}.item p{margin:2px 0}.item .meta{color:var(--mute);font-size:12px}
.wrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
td.w{white-space:normal;min-width:200px}
th{background:var(--panel2);font-weight:650;position:sticky;top:0}th[data-sort]{cursor:pointer}th[aria-sort="ascending"]::after{content:" \25B2";font-size:10px}th[aria-sort="descending"]::after{content:" \25BC";font-size:10px}
.n{text-align:right}tr:hover td{background:var(--panel2)}
.tbar{display:flex;gap:8px;align-items:center;margin:4px 0 6px;flex-wrap:wrap}
.pager{display:flex;gap:8px;align-items:center;padding:6px 2px;color:var(--mute)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:6px 8px;min-width:0}
input[type=search]{width:240px;max-width:100%}
button{font:inherit;padding:6px 12px;border:1px solid var(--acc);background:var(--acc);color:var(--panel);cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--acc)}button.sm{padding:2px 8px;font-size:12px}button.danger{border-color:var(--neg);color:var(--neg);background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mute)}
.bigin{font:650 26px/1.2 system-ui,sans-serif;width:210px}
.bar{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px}.bar .t{flex:1;background:var(--panel2);height:12px;position:relative}.bar .f{height:12px;background:var(--acc)}.bar .lim{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--neg)}.bar .lab{width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg.chart{width:100%;height:auto;display:block}svg text{fill:var(--mute);font-size:9px}
[data-tip]{position:relative;border-bottom:1px dotted var(--mute);cursor:help}
[data-tip]:hover::after,[data-tip]:focus::after{content:attr(data-tip);position:absolute;left:0;top:100%;z-index:9;background:var(--ink);color:var(--panel);padding:5px 8px;font-size:12px;width:max-content;max-width:280px;white-space:normal;font-weight:400}
.loading{padding:30px;color:var(--mute)}
details{background:var(--panel);border:1px solid var(--line);padding:6px 10px;margin:6px 0}summary{cursor:pointer;font-weight:600}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:block;border-right:0;border-bottom:1px solid var(--line);padding:6px}
 .side .brand,.side .foot{display:none}.side nav{display:flex;overflow-x:auto;gap:2px}.side nav a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}.side nav a[aria-current="page"]{border-bottom-color:var(--acc)}
 .top{position:static}#view{padding:12px}.bigin{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="app">
 <aside class="side"><div class="brand">MIS<small>Investment research terminal</small></div>
  <nav aria-label="Main" id="nav"></nav>
  <div class="foot"><button class="ghost sm" id="themebtn" aria-label="Toggle dark and light mode">Dark / light</button></div></aside>
 <div class="main"><div class="top"><h1 id="pagetitle">Overview</h1><div class="chips" id="chips" aria-label="System status"></div></div>
  <main id="view" tabindex="-1"><div class="loading" role="status">Loading dashboard...</div></main></div>
</div>
<script id="mis-data" type="application/json">__DATA__</script>
<script>__LOGIC__</script>
<script>__LEDGER__</script>
<script>__CLOUD__</script>
<script>__APP__</script>
</body></html>
