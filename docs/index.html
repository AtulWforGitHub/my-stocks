*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--acc)}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:15px;padding:4px 10px 12px}.brand small{display:block;font-weight:400;color:var(--mute);font-size:12px}

.main{min-width:0}

.mute{color:var(--mute)}.pos{color:var(--pos)}.neg{color:var(--neg)}.amb{color:var(--amb)}

.banner.neg{border-color:var(--neg);background:var(--negbg)}

.panel>h2:first-child,.panel>h3:first-child{margin-top:0}

.tag.pos{background:var(--posbg)}.tag.neg{background:var(--negbg)}.tag.amb{background:var(--ambbg)}
.item{border:1px solid var(--line);border-left:4px solid var(--line);background:var(--panel);padding:9px 12px;margin:7px 0}

button:disabled{opacity:.45;cursor:not-allowed}

.bigin{font:650 26px/1.2 system-ui,sans-serif;width:210px}
.bar{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px}.bar .t{flex:1;background:var(--panel2);height:12px;position:relative}.bar .f{height:12px;background:var(--acc)}.bar .lim{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--neg)}.bar .lab{width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

[data-tip]:hover::after,[data-tip]:focus::after{content:attr(data-tip);position:absolute;left:0;top:100%;z-index:9;background:var(--ink);color:var(--panel);padding:5px 8px;font-size:12px;width:max-content;max-width:280px;white-space:normal;font-weight:400}

<script>/* Decision logic shared by the browser dashboard and the optional private email review. Decision support only. */
(function (root) {
  'use strict';
  const r2 = (x) => Math.round(x * 100) / 100;
  const tick = (x) => Math.round(x * 20) / 20;           // NSE tick size 0.05
  const STATES = ['HOLD', 'ACCUMULATE CANDIDATE', 'WATCH', 'REDUCE CANDIDATE', 'EXIT REVIEW', 'DATA UNAVAILABLE'];

  // How old is the report? Evaluated when the page is OPENED, not when the report was built.
  function reportAgeDays(priceDate, now) { return priceDate ? Math.floor((now - new Date(priceDate + 'T00:00:00')) / 86400000) : null; }
  function markStale(stocks, priceDate, limit, now) {
    const age = reportAgeDays(priceDate, now);
    if (age == null || age <= limit) return stocks;
    return stocks.map(s => ({ ...s, fresh: false, stale: true, staleDays: age }));
  }
  // Same tolerance as the Python side: 3% under the bottom of the range, 1% over the top.
  function rangePos(s) {
    if (!s || !s.zones || s.price == null) return 'unknown';
    const z = s.zones.ideal;
    return s.price > z[1] * 1.01 ? 'above' : s.price < z[0] * 0.97 ? 'below' : 'in_range';
  }

  function priceOf(h, byT) {
    const s = byT[h.ticker];
    if (s && s.fresh && s.price != null && s.status !== 'DATA UNAVAILABLE') return { price: s.price, source: 'market', asof: s.asof };
    if (s && s.stale && s.price != null) return { price: s.price, source: 'stale', asof: s.asof };      // shown for value only; never used for advice
    if (h.manualPrice > 0) return { price: h.manualPrice, source: 'manual', asof: null };
    return { price: null, source: 'none', asof: null };
  }

  function portfolio(holdings, byT) {
    const rows = holdings.filter(h => h.qty > 0).map(h => {
      const s = byT[h.ticker] || {}, p = priceOf(h, byT), invested = h.qty * h.avg;
      const value = p.price == null ? null : h.qty * p.price;
      const dayChg = value != null && s.chg1d != null && p.source === 'market' ? value - value / (1 + s.chg1d / 100) : null;
      return { ...h, name: s.name || h.ticker, sector: s.sector || 'Other', cap: s.cap || '?', price: p.price, priceSource: p.source,
               invested, value, pnl: value == null ? null : value - invested, pnlPct: value == null ? null : (value / invested - 1) * 100, dayChg };
    });
    const total = rows.reduce((a, r) => a + (r.value || 0), 0);
    const invested = rows.reduce((a, r) => a + r.invested, 0);
    rows.forEach(r => { r.weight = total > 0 && r.value != null ? r.value / total * 100 : null; });
    const sectors = {};
    rows.forEach(r => { sectors[r.sector] = (sectors[r.sector] || 0) + (r.weight || 0); });
    const dc = rows.filter(r => r.dayChg != null);
    const pricedInvested = rows.filter(r => r.price != null).reduce((a, r) => a + r.invested, 0);
    return { rows, total, invested, pnl: total - pricedInvested, sectors, dayChange: dc.length ? dc.reduce((a, r) => a + r.dayChg, 0) : null,
             missingPrices: rows.filter(r => r.price == null).map(r => r.ticker) };
  }

  /* Gate answers: debt 'yes'|'no'|null, emergency 'ok'|'low'|null. Unanswered = UNVERIFIED = never approvable. */
  function safetyGate(amount, safety) {
    const s = safety || {}, notes = [];
    let status = 'OPEN', budget = amount;
    if (s.debt === 'yes') { status = 'CLOSED'; budget = 0; notes.push('You have debt costing 12% a year or more. Repaying it is a certain saving; stock returns are not. No stock purchase is recommended.'); }
    else if (s.debt == null || s.emergency == null) { status = 'UNVERIFIED'; notes.push('Answer the two safety questions to unlock an approvable plan. Until then this plan is a preview only.'); }
    else if (s.emergency === 'low') { status = 'REDUCED'; budget = amount * 0.5; notes.push('Your emergency fund is under 6 months of expenses, so only half of this month\'s amount is used.'); }
    return { status, budget, notes, approvable: status === 'OPEN' || status === 'REDUCED' };
  }

  function limitsContext(port, rules) {
    const heldW = {}; port.rows.forEach(r => { heldW[r.ticker] = r.weight || 0; });
    const smallW = port.rows.reduce((a, r) => a + (r.cap === 'S' ? (r.weight || 0) : 0), 0);
    return { building: port.rows.length < rules.minPositions, heldW, smallW };
  }

  function monthlyPlan(amount, safety, stocks, port, rules, opts) {
    opts = opts || {};
    const gate = safetyGate(amount, safety), mode = opts.mode || 'real';
    const plan = { gate, mode, budget: gate.budget, rows: [], skipped: [], cashLeft: gate.budget, totalSpend: 0, verdict: '', approvable: false, notes: [] };
    if (!(amount > 0)) { plan.verdict = 'Enter an amount to see your plan.'; plan.cashLeft = 0; return plan; }
    if (gate.budget <= 0) { plan.verdict = 'NO PURCHASE RECOMMENDED this month (safety check).'; return plan; }
    if (stocks.length && stocks.every(s => s.stale)) {

      plan.cashLeft = plan.budget; return plan;
    }
    const { building, heldW, smallW } = limitsContext(port, rules), by = {};
    stocks.forEach(s => { by[s.ticker] = s; });
    const user = Array.isArray(opts.selected) && opts.selected.length;
    const pool = user ? opts.selected.slice(0, 10).map(t => by[t]).filter(Boolean) : stocks.filter(s => s.status === 'ACCUMULATE CANDIDATE');
    const elig = [];
    for (const s of pool) {
      const why = (m) => plan.skipped.push({ ticker: s.ticker, reason: m });
      if (!s.fresh || s.price == null || s.status === 'DATA UNAVAILABLE' || !s.zones) { why('price/data unavailable or stale: no purchase on unreliable data'); continue; }
      if (s.status === 'AVOID' || s.gov === 'red_flag') { why('flagged AVOID / governance red flag'); continue; }
      if (rangePos(s) === 'below') { why('price is well below the preferred range, which signals a weak trend: not a candidate even if you selected it (a buy limit above the market would simply fill now)'); continue; }
      if (!user && rangePos(s) !== 'in_range') { why('not inside its preferred range'); continue; }
      if (!building && (heldW[s.ticker] || 0) >= rules.maxSingle) { why('already at your max single-stock weight'); continue; }
      if (!building && (port.sectors[s.sector] || 0) >= rules.maxSector) { why(s.sector + ' already at the sector limit'); continue; }
      if (!building && s.cap === 'S' && smallW >= rules.maxSmall) { why('small-cap share already at ' + rules.maxSmall + '%'); continue; }
      let fit = s.research * 0.45 + (s.entry || 0) * 0.35;
      if ((port.sectors[s.sector] || 0) >= rules.maxSector * 0.85) fit -= 25;
      elig.push({ s, fit });
    }
    if (!user) elig.sort((a, b) => b.fit - a.fit);
    const nAuto = Math.max(1, Math.min(rules.maxStocks, Math.floor(plan.budget / rules.minPerPosition)));
    const n = user ? elig.length : Math.min(nAuto, elig.length);
    const slice = n ? plan.budget / n : 0, k = 1 + rules.buyCostPct / 100, chosen = [];
    for (const c of elig) {
      if (chosen.length >= n) break;
      const z = c.s.zones.ideal, inRange = rangePos(c.s) === 'in_range';
      const limit = tick(inRange ? c.s.price : z[1]);
      if (limit * k > slice) { plan.skipped.push({ ticker: c.s.ticker, reason: 'one share (Rs ' + Math.round(limit) + ') is bigger than its slice (Rs ' + Math.round(slice) + ') of this month\'s amount' }); continue; }
      chosen.push({ ...c, limit, inRange });
    }
    if (!chosen.length) { plan.verdict = 'NO PURCHASE RECOMMENDED this month: nothing meets entry, data and affordability checks. Keeping the cash is a valid decision.'; return plan; }
    let w;
    const ov = opts.overrides || {}, hasOv = chosen.some(c => ov[c.s.ticker] > 0);
    if (hasOv) {
      const given = chosen.reduce((a, c) => a + (ov[c.s.ticker] > 0 ? ov[c.s.ticker] : 0), 0), others = chosen.filter(c => !(ov[c.s.ticker] > 0)).length;
      w = chosen.map(c => ov[c.s.ticker] > 0 ? ov[c.s.ticker] : (others ? Math.max(100 - given, 0) / others : 0));
      if (Math.abs(given - 100) > 0.5 && !others) plan.notes.push('Your edited percentages added up to ' + r2(given) + '%; they were scaled to 100%.');
    } else if (opts.method === 'equal') w = chosen.map(() => 1);
    else w = chosen.map(c => Math.max(c.s.research, 1) / Math.max(c.s.atrPct || 3, 1.5));    // risk-adjusted: score per unit of volatility
    const tw = w.reduce((a, b) => a + b, 0) || 1; w = w.map(x => x / tw);
    let rows = chosen.map((c, i) => ({ ticker: c.s.ticker, name: c.s.name, sector: c.s.sector, cap: c.s.cap, current: c.s.price, limit: c.limit, inRange: c.inRange,
      distancePct: c.s.zones.distance_pct || 0, zone: c.s.zones.ideal, review: c.s.zones.thesis_review, research: c.s.research, entry: c.s.entry, conf: c.s.confidence,
      gov: c.s.gov, reason: (c.s.why || []).slice(0, 2).join('; '), weightPlanned: w[i] * 100,
      risks: [c.s.bear != null ? 'Bear-case illustration: ' + c.s.bear + '% over 12 months' : null, c.s.invalidation && c.s.invalidation[0] ? 'Thesis breaks if: ' + c.s.invalidation[0] : null,
              c.s.atrPct ? 'Typical daily swing about ' + c.s.atrPct.toFixed(1) + '%' : null].filter(Boolean),
      shares: Math.floor(plan.budget * w[i] / (c.limit * k)), cost: 0, amount: 0 }));
    let left = plan.budget - rows.reduce((a, r) => a + r.shares * r.limit * k, 0);
    for (const r of [...rows].sort((a, b) => a.limit - b.limit)) { const u = r.limit * k; if (left >= u) { const m = Math.floor(left / u); r.shares += m; left -= m * u; } }

    if (!rows.length) { plan.verdict = 'NO PURCHASE RECOMMENDED: the amount is too small for one share of any candidate.'; return plan; }
    rows.forEach(r => { r.amount = r2(r.shares * r.limit); r.cost = r2(r.amount * rules.buyCostPct / 100); });
    const tot = rows.reduce((a, r) => a + r.amount + r.cost, 0);
    rows.forEach(r => { r.pctOfMonth = r2((r.amount + r.cost) / tot * 100);
      const held = (heldW[r.ticker] || 0) / 100 * port.total; r.weightAfter = r2((held + r.amount) / (port.total + tot) * 100);

  function stageRow(r) {

    sh[0] = Math.min(sh[0], r.shares); sh[1] = Math.min(sh[1], r.shares - sh[0]); sh[2] = r.shares - sh[0] - sh[1];

    return { tranches: tr, avg: r2(cost / r.shares), vsImmediate: r2(cost / r.shares - r.limit),

  }

  function concentrationBreaches(port, rules) {
    const out = [], { building } = limitsContext(port, rules);
    if (building) return out;
    port.rows.forEach(r => { if (r.weight > rules.maxSingle) out.push({ kind: 'position', subject: r.name, ticker: r.ticker, value: r.weight, limit: rules.maxSingle }); });
    Object.keys(port.sectors).forEach(k => { if (port.sectors[k] > rules.maxSector) out.push({ kind: 'sector', subject: k, value: port.sectors[k], limit: rules.maxSector }); });
    const sm = port.rows.reduce((a, r) => a + (r.cap === 'S' ? (r.weight || 0) : 0), 0);
    if (sm > rules.maxSmall) out.push({ kind: 'smallcap', subject: 'small-cap total', value: sm, limit: rules.maxSmall });
    return out;
  }

  function holdingActions(port, byT, rules, today) {
    const { building } = limitsContext(port, rules), cap = building ? rules.concCapBuilding : rules.maxSingle, out = [];
    for (const r of port.rows) {
      const s = byT[r.ticker];
      const a = { ticker: r.ticker, name: r.name, action: 'HOLD', tone: 'mute', qty: 0, reasons: [], priceNote: '', notes: [], confidence: 'Low', limits: [] };
      if (r.price == null) { a.action = 'DATA UNAVAILABLE'; a.reasons.push('No reliable market price. Type a price in the portfolio table to include it.'); out.push(a); continue; }
      if (r.priceSource === 'stale') { a.action = 'DATA UNAVAILABLE'; a.reasons.push('This report\'s prices are ' + ((byT[r.ticker] || {}).staleDays || 'several') + ' days old, so no advice is given. Value is shown at the last known price only.'); out.push(a); continue; }
      if (!s) { a.action = 'DATA UNAVAILABLE'; a.reasons.push('This stock is not covered by the research screen, so no automatic view is possible. Treat as research required.'); out.push(a); continue; }
      if (s.status === 'DATA UNAVAILABLE') { a.action = 'DATA UNAVAILABLE'; a.reasons.push(s.why.join('; ')); out.push(a); continue; }
      const z = s.zones, atr = s.atr || r.price * 0.02, w = r.weight || 0;
      a.confidence = (s.confidence && s.confidence.label) || 'Low'; a.limits = (s.confidence && s.confidence.limits) || [];
      const range = 'indicative limit order between Rs ' + r2(r.price).toFixed(2) + ' and Rs ' + r2(r.price + 0.3 * atr).toFixed(2);
      if (s.gov === 'red_flag' || s.status === 'AVOID') {

        a.priceNote = 'If you decide to exit all ' + r.qty + ' shares: ' + range;
      } else if (z && r.price < z.thesis_review) {

        a.reasons.push('Read the latest results, filings and news. Sell only if the business got weaker.');
      } else if (w > cap) {
        const target = (building ? cap * 0.85 : rules.maxSingle * 0.9) / 100;
        let q = Math.ceil((r.value - target * port.total) / r.price);
        q = Math.max(1, Math.min(q, Math.floor(r.qty * 0.5) || 1, r.qty));
        a.action = 'REDUCE CANDIDATE'; a.tone = 'amb'; a.qty = q;
        a.reasons.push('This is ' + w.toFixed(1) + '% of your portfolio, above the ' + cap + '% limit. A portfolio-balance rule, not a view that the business is bad.');
        a.priceNote = 'If you reduce by ' + q + ' of ' + r.qty + ' shares: ' + range;
      } else if (s.ext200 != null && s.ext200 > 40 && r.pnlPct > 50 && r.qty >= 2) {
        const q = Math.max(1, Math.floor(r.qty * 0.25));
        a.action = 'REDUCE CANDIDATE'; a.tone = 'amb'; a.qty = q;
        a.reasons.push('Price is ' + s.ext200.toFixed(0) + '% above its 200-day average and you are up ' + r.pnlPct.toFixed(0) + '%. Booking about a quarter locks in gains and keeps the rest.');
        a.priceNote = 'If you reduce by ' + q + ' of ' + r.qty + ' shares: ' + range;
      } else if (s.status === 'ACCUMULATE CANDIDATE' && z && rangePos(s) === 'in_range' && w < cap * 0.8) {
        a.action = 'ACCUMULATE CANDIDATE'; a.tone = 'pos';
        a.reasons.push('Business score ' + s.research + ' and the price is inside the preferred entry range.');
        a.priceNote = 'Add via limit order at or below Rs ' + z.ideal[1].toFixed(2) + ' (range ' + z.ideal[0].toFixed(2) + ' to ' + z.ideal[1].toFixed(2) + ')';
      } else if (s.status === 'WATCH') {
        a.action = 'WATCH'; a.tone = 'amb'; a.reasons.push((s.why || []).slice(0, 2).join('; '));
      } else a.reasons.push('Nothing material changed. Price moves alone are not a reason to sell.');
      a.notes.push('Long-term view: this status reflects business and portfolio evidence. Short-term trading level, kept separate and not an instruction: volatility stop near Rs ' + (z ? z.trading_stop : 'n/a') + '.');
      if (z) a.notes.push('Thesis re-check level: Rs ' + z.thesis_review + '.');

        const held = Math.floor((today - new Date(r.date)) / 86400000);
        if (held < 365) a.notes.push('Held ' + held + ' days. Selling before 1 year is short-term tax (20%); after 1 year it is 12.5% above Rs 1.25 lakh a year. Estimate: check with a CA.');
      }
      out.push(a);
    }

    out.sort((x, y) => (order[x.action] ?? 9) - (order[y.action] ?? 9));

  const api = { STATES, reportAgeDays, markStale, rangePos, priceOf, portfolio, safetyGate, monthlyPlan, stageRow, holdingActions, concentrationBreaches, limitsContext, tick };

<script>/* Transaction ledger: FIFO lots, realised P&L, dividends, XIRR, benchmark comparison, CSV validation, tax estimate.
   Runs in the browser; also used by the optional private email review. Holdings never reach the public repo. */
(function (root) {
  'use strict';
  const TYPES = ['buy', 'sell', 'dividend', 'split', 'bonus'];
  const DAY = 86400000;
  const d2 = (s) => new Date(s + 'T00:00:00Z');

  function parseCSV(text) {
    const lines = String(text).split(/\r?\n/).filter(l => l.trim().length);
    const errors = [], rows = [], seen = new Set();
    if (!lines.length) return { rows, errors: ['The file is empty.'] };
    const head = lines[0].split(',').map(h => h.trim().toLowerCase());
    const need = ['date', 'type', 'ticker', 'quantity', 'price'];
    const miss = need.filter(h => head.indexOf(h) < 0);
    if (miss.length) return { rows, errors: ['Missing column(s): ' + miss.join(', ') + '. Expected: date,type,ticker,quantity,price,fees,note'] };
    for (let i = 1; i < lines.length; i++) {
      const c = lines[i].split(','), g = (k) => (c[head.indexOf(k)] || '').trim(), n = i + 1;
      const date = g('date'), type = g('type').toLowerCase(), ticker = g('ticker').toUpperCase();
      const q = parseFloat(g('quantity')), p = parseFloat(g('price')), f = parseFloat(g('fees') || '0');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || isNaN(d2(date))) { errors.push('Line ' + n + ': bad date "' + date + '" (use YYYY-MM-DD)'); continue; }
      if (TYPES.indexOf(type) < 0) { errors.push('Line ' + n + ': type "' + type + '" must be one of ' + TYPES.join('/')); continue; }
      if (!ticker) { errors.push('Line ' + n + ': empty stock'); continue; }
      if (!(q > 0) || isNaN(p) || p < 0 || isNaN(f) || f < 0) { errors.push('Line ' + n + ': quantity must be > 0; price and fees must be numbers >= 0'); continue; }
      const key = [date, type, ticker, q, p].join('|');
      if (seen.has(key)) { errors.push('Line ' + n + ': duplicate of an earlier row, skipped'); continue; }
      seen.add(key);
      rows.push({ date, type, ticker: normTicker(ticker), qty: q, price: p, fees: f || 0, note: g('note') });
    }
    return { rows, errors };
  }
  function normTicker(t) { t = String(t).trim().toUpperCase(); return t.indexOf('.') > 0 ? t : t + '.NS'; }

  function sorted(txs) {   // stable: by date, then original order; undated rows (migrated positions) first
    return txs.map((t, i) => ({ t, i })).sort((a, b) => ((a.t.date || '0000') < (b.t.date || '0000') ? -1 : (a.t.date || '0000') > (b.t.date || '0000') ? 1 : a.i - b.i)).map(x => x.t);
  }

  function buildLedger(txs) {
    const lots = {}, realized = [], dividends = {}, errors = [];
    for (const t of sorted(txs)) {
      const L = lots[t.ticker] = lots[t.ticker] || [];
      const held = L.reduce((a, l) => a + l.qty, 0);
      if (t.type === 'buy') L.push({ qty: t.qty, unit: (t.qty * t.price + (t.fees || 0)) / t.qty, date: t.date });
      else if (t.type === 'sell') {
        if (t.qty > held + 1e-9) { errors.push((t.date || '') + ' sell ' + t.ticker + ': selling ' + t.qty + ' but only ' + held + ' held; ignored'); continue; }
        let rem = t.qty; const unitNet = (t.qty * t.price - (t.fees || 0)) / t.qty;
        while (rem > 1e-9) {
          const lot = L[0], take = Math.min(lot.qty, rem);
          realized.push({ ticker: t.ticker, sellDate: t.date, buyDate: lot.date, qty: take, pnl: take * (unitNet - lot.unit),
                          days: lot.date && t.date ? Math.floor((d2(t.date) - d2(lot.date)) / DAY) : null });
          lot.qty -= take; rem -= take; if (lot.qty <= 1e-9) L.shift();
        }
      } else if (t.type === 'dividend') dividends[t.ticker] = (dividends[t.ticker] || 0) + held * t.price;
      else if (t.type === 'split') L.forEach(l => { l.qty *= t.qty; l.unit /= t.qty; });
      else if (t.type === 'bonus' && held > 0) {
        const add = held * t.qty, cost = L.reduce((a, l) => a + l.qty * l.unit, 0);
        L.forEach(l => { l.unit = cost / (held + add); }); L.push({ qty: add, unit: cost / (held + add), date: t.date });
      }

    return { lots, realized, dividends, errors };
  }

  function positions(ledger) {
    const out = [];
    for (const tk of Object.keys(ledger.lots)) {
      const L = ledger.lots[tk], qty = L.reduce((a, l) => a + l.qty, 0);
      if (qty <= 1e-9) continue;
      const cost = L.reduce((a, l) => a + l.qty * l.unit, 0);
      const dates = L.map(l => l.date).filter(Boolean).sort();
      out.push({ ticker: tk, qty, avg: cost / qty, date: dates[0] || '' });
    }
    return out;
  }

  function xirr(flows) {
    if (flows.length < 2 || !flows.some(f => f.amt < 0) || !flows.some(f => f.amt > 0)) return null;
    const t0 = Math.min.apply(null, flows.map(f => +f.date));
    const npv = (r) => flows.reduce((a, f) => a + f.amt / Math.pow(1 + r, (f.date - t0) / (365 * DAY)), 0);
    let lo = -0.99, hi = 10, flo = npv(lo), fhi = npv(hi);
    if (flo * fhi > 0) return null;
    for (let i = 0; i < 200; i++) {
      const mid = (lo + hi) / 2, fm = npv(mid);
      if (Math.abs(fm) < 1e-7) return mid;
      if (flo * fm < 0) { hi = mid; } else { lo = mid; flo = fm; }
    }
    return (lo + hi) / 2;
  }

  function flows(txs) {
    const out = [], held = {}; let undated = false;
    for (const t of sorted(txs)) {
      if (!t.date) { if (t.type === 'buy') undated = true; continue; }
      const h = held[t.ticker] || 0, d = d2(t.date);
      if (t.type === 'buy') { out.push({ date: d, amt: -(t.qty * t.price + (t.fees || 0)) }); held[t.ticker] = h + t.qty; }
      else if (t.type === 'sell') { out.push({ date: d, amt: t.qty * t.price - (t.fees || 0) }); held[t.ticker] = h - t.qty; }
      else if (t.type === 'dividend') out.push({ date: d, amt: h * t.price });
      else if (t.type === 'split') held[t.ticker] = h * t.qty;
      else if (t.type === 'bonus') held[t.ticker] = h * (1 + t.qty);
    }
    return { flows: out, undated };
  }

  function portfolioXirr(txs, endValue, endDate, missingPrices) {
    if (missingPrices && missingPrices.length) return { value: null, why: missingPrices.length + ' holding(s) have no price, so the end value is incomplete and XIRR would be wrong. Type the missing prices on the Portfolio page.' };
    const f = flows(txs);
    if (f.undated) return { value: null, why: 'Some positions have no buy date, so XIRR cannot be computed. Add dated transactions.' };
    if (f.flows.length < 1) return { value: null, why: 'No dated transactions.' };
    const first = Math.min.apply(null, f.flows.map(x => +x.date));
    if ((endDate - first) / DAY < 90) return { value: null, why: 'Less than 3 months of history: XIRR would be misleading.' };
    const v = xirr(f.flows.concat([{ date: endDate, amt: endValue }]));
    return { value: v, why: v == null ? 'XIRR did not converge.' : '' };
  }

  // Same cash flows invested in the Nifty 50 price index (excludes dividends: an understatement of the benchmark).
  function benchXirr(txs, bench, endDate) {
    const f = flows(txs);
    if (f.undated || !bench || !bench.length || !f.flows.length) return null;
    const px = (d) => { let p = null; for (const b of bench) { if (d2(b[0]) <= d) p = b[1]; else break; } return p; };
    let units = 0;
    for (const x of f.flows) { const p = px(x.date); if (!p) return null; units += -x.amt / p; }
    const pe = bench[bench.length - 1][1];
    return xirr(f.flows.concat([{ date: endDate, amt: units * pe }]));
  }

  function taxEstimate(realized, fyStart) {
    const inFY = realized.filter(r => r.sellDate && r.sellDate >= fyStart);
    const st = inFY.filter(r => r.days != null && r.days <= 365).reduce((a, r) => a + r.pnl, 0);
    const lt = inFY.filter(r => r.days != null && r.days > 365).reduce((a, r) => a + r.pnl, 0);
    return { stcg: st, ltcg: lt, tax: Math.max(st, 0) * 0.20 + Math.max(lt - 125000, 0) * 0.125 };
  }

  const api = { parseCSV, buildLedger, positions, xirr, portfolioXirr, benchXirr, taxEstimate, normTicker, TYPES };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.LEDGER = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* Encrypted cloud copy of your holdings.
   Encryption happens in YOUR browser (AES-256-GCM, key from your passphrase via PBKDF2-SHA256, 600,000 rounds).
   Only the scrambled blob is stored in the repository. The passphrase never leaves your device (unless you tick "remember"). */
(function (root) {

  const url = (cfg) => `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path || 'docs/holdings.enc.json'}`;
  const headers = (cfg) => ({ Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' });

var timer = null; function later() { clearTimeout(timer); timer = setTimeout(render, 250); }
function bindEl(el) {

  if (k === 'cloudauto') { S.cloud.auto = v; persist(); if (v) scheduleCloud(); return true; }

  else if (k.indexOf('sel:') === 0) { t = k.slice(4); var i = S.selected.indexOf(t); if (v && i < 0) { if (S.selected.length >= 10) { alert('You can consider at most 10 stocks.'); render(); return; } S.selected.push(t); } else if (!v && i >= 0) S.selected.splice(i, 1); S.overrides = {}; }

  save(); return true;
}
document.addEventListener('input', function (e) { var el = e.target;
  if (el.getAttribute && el.getAttribute('data-draft')) { DRAFT[el.getAttribute('data-draft')] = el.type === 'checkbox' ? el.checked : el.value; return; }
  if (el.getAttribute && el.getAttribute('data-cfg')) { S.cloud[el.getAttribute('data-cfg')] = el.value.trim(); persist(); return; }
  if (el.getAttribute && el.getAttribute('data-tq')) { var id = el.getAttribute('data-tq'); TBL[id].q = el.value; TBL[id].page = 0; document.getElementById('tbb-' + id).innerHTML = tbody(id); return; }
  if (el.getAttribute && el.getAttribute('data-bind') && el.type !== 'radio' && el.type !== 'checkbox') { if (bindEl(el)) later(); } });
document.addEventListener('change', function (e) { var el = e.target;
  if (el.getAttribute && el.getAttribute('data-draft') && el.type === 'checkbox') { DRAFT[el.getAttribute('data-draft')] = el.checked; return; }
  if (el.getAttribute && el.getAttribute('data-bind') && (el.type === 'radio' || el.type === 'checkbox')) { if (bindEl(el)) render(); }
  else if (el.id === 'csvfile' && el.files[0]) { var r = new FileReader(); r.onload = function () { csvDraft = r.result; importPreview = LEDGER.parseCSV(r.result); render(); }; r.readAsText(el.files[0]); }
  else if (el.id === 'restorefile' && el.files[0]) { var r2 = new FileReader(); r2.onload = function () { try { var o = JSON.parse(r2.result); if (!Array.isArray(o.tx)) throw 0; var keepCloud = S.cloud; S = Object.assign(S, o); S.cloud = keepCloud; save(); render(); } catch (x) { alert('That file is not a valid backup.'); } }; r2.readAsText(el.files[0]); } });
document.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('data-sort')) { e.preventDefault(); e.target.click(); } });

});

  'cloud-save': function () { actSave(false); return 'none'; }, 'cloud-overwrite': function () { if (confirm('Replace the cloud copy with the data on THIS device? The other device\'s newer changes will be lost.')) actSave(true); return 'none'; },

  addsel: function (el) { var t = el.dataset.t; if (S.selected.indexOf(t) < 0 && S.selected.length < 10) S.selected.push(t); S.overrides = {}; save(); location.hash = '#/planner'; return 'nav'; },
  autopick: function () { S.selected = []; S.overrides = {}; },

  'plan-dismiss': function () { var c = ctx(); c.plan.rows.forEach(function (r) { logDecision({ key: 'plan:' + r.ticker + ':' + Date.now(), ticker: r.ticker, name: r.name, proposed: 'BUY candidate via monthly plan', qty: r.shares, limit: r.limit, why: [r.reason] }, 'rejected'); }); S.plans.unshift({ id: uid(), date: new Date().toISOString().slice(0, 10), amount: c.amt, status: 'dismissed', rows: [] }); },

  decide: function (el) { var c = ctx(), i = allItems(c).filter(function (x) { return x.id === el.dataset.id; })[0]; if (i) logDecision({ key: 'item:' + i.id, ticker: i.ticker, name: i.name, proposed: i.title, why: [i.reason], qty: i.qty }, el.dataset.d); },
  jr: function (el) { S.journal.forEach(function (j) { if (j.id === el.dataset.id && j.decision === 'deferred') { j.decision = el.dataset.d; j.decidedAt = new Date().toISOString(); } }); },
  'jr-note': function (el) { var n = prompt('Add a note (it is appended and dated):'); if (n) S.journal.forEach(function (j) { if (j.id === el.dataset.id) j.note = (j.note ? j.note + ' | ' : '') + new Date().toISOString().slice(0, 10) + ': ' + n; }); },
  'csv-check': function () { csvDraft = document.getElementById('csvtext').value; importPreview = LEDGER.parseCSV(csvDraft); },
  'csv-import': function () { if (!importPreview) return; var add = importPreview.rows.map(function (r) { return Object.assign({ id: uid() }, r); }), prev = S.tx.slice(); S.tx = S.tx.concat(add);
    var L = LEDGER.buildLedger(S.tx); if (L.errors.length) { S.tx = prev; return alert('Nothing imported: ' + L.errors[0]); } importPreview = null; csvDraft = ''; },
  'tx-del': function (el) { if (confirm('Delete this transaction?')) S.tx = S.tx.filter(function (t) { return t.id !== el.dataset.id; }); },
  export: function () { var b = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'mis-backup.json'; a.click(); return 'none'; },
  restore: function () { document.getElementById('restorefile').click(); return 'none'; },
  wipe: function () { if (confirm('Erase all transactions, decisions and plans on this device? Download a backup first.')) { try { localStorage.removeItem(KEY); localStorage.removeItem('mis_cloud_token'); localStorage.removeItem('mis_cloud_pass'); } catch (e) {} location.reload(); return 'none'; } return 'none'; }
};
